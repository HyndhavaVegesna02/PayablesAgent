name: 08-drift-with-no-explanation
title: Drift with no explanation
passes_when: Owner asked; planner uses the lower balance meanwhile
steps:
  - at: "2026-10-15T09:00"
  - poll: true
  - at: "2026-10-15T13:00"
  - deliver: [04-debit-city-electricity-balance-short.eml]
  - poll: true
  - at: "2026-10-15T23:00"
  - drain: true
expect:
  - id: agent-tried-medium-then-high
    component: agent
    level: trajectory
    fixtures_only: true             # the fixture AI's scripted path; a live model may take another
    sql: SELECT thinking || ' ' || escalation_rule FROM agent_case WHERE kind = 'drift'
    equals: "high max_steps"
  - id: owner-asked-for-the-real-balance
    component: agent
    sql: SELECT COUNT(*) FROM owner_question WHERE kind = 'confirm_balance' AND status = 'OPEN'
    equals: 1
  - id: account-waits-for-the-owner
    component: reconcile
    sql: SELECT drift_status FROM bank_account WHERE id = 1
    equals: ASK_OWNER
  - id: plan-uses-the-lower-balance
    component: planner
    sql: SELECT opening_cash_paise FROM plan_run WHERE is_current = 1
    equals: 56500000
  - id: path-budget-steps   # path budget (CHG-050): all cases within 14 agent steps; the committed live runs used at most 11 (live-baseline, live-after-batch-8); applies live too
    component: agent
    level: trajectory
    sql: SELECT COALESCE(SUM(json_extract(state_json, '$.steps_total')), 0) <= 14 FROM agent_case
    equals: 1
  - id: path-budget-refused   # path budget (CHG-050): at most 3 calls code refused (an unknown tool, bad arguments, a repeat, a final answer), counted from the notes code writes, never the model's own words; applies live too
    component: agent
    level: trajectory
    sql: "SELECT (SELECT COUNT(*) FROM agent_case c, json_each(c.state_json, '$.notes') n WHERE n.value GLOB 'final answer refused by code*' OR n.value GLOB 'step [0-9]*: refused unknown tool *' OR n.value GLOB 'step [0-9]*: refused [a-z]*_[a-z]*: *') + (SELECT COUNT(*) FROM agent_case c, json_each(c.state_json, '$.findings') f WHERE json_extract(f.value, '$.lines[0]') GLOB 'refused*') <= 3"
    equals: 1
outcome:
  - id: no-transaction-invented
    sql: SELECT COUNT(*) FROM bank_txn WHERE amount_paise <> 3500000 AND status <> 'ADJUSTMENT'
    equals: 0
  - id: plan-counts-only-money-that-is-there   # planned from the lower of the two balances: lowest Rs.95,000, not Rs.1,15,000
    plan:
      lowest_paise: 9500000
